    - source: Role
      target: Collective
      edge_types: [C_DEPENDS_ON, C_PART_OF, C_OWNS, C_GOVERNS, C_SUPPORTS, C_COLLABORATES_WITH]
    - source: Role
      target: Role
      edge_types: [C_DEPENDS_ON, C_REPORTS_TO, C_COLLABORATES_WITH]
    - source: Role
      target: Activity
