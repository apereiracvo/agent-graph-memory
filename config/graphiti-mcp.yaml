      target: Person
      edge_types: [C_DEPENDS_ON, C_COLLABORATES_WITH]
    - source: Collective
      target: Collective
      edge_types: [C_DEPENDS_ON, C_PART_OF, C_MEMBER_OF, C_OWNS, C_GOVERNS, C_SUPPORTS, C_COLLABORATES_WITH]
