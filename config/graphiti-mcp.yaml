      edge_types: [C_DEPENDS_ON, C_RESPONSIBLE_FOR, C_ACCOUNTABLE_FOR, C_AUTHORIZED_FOR, C_OWNS, C_GOVERNS, C_SUPPORTS]
    - source: Role
