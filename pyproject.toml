[project]
name = "agent-graph-memory"
version = "0.1.0"
description = "Experiments with Graphiti-backed agent memory"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
  "graphiti-core[falkordb]==0.29.3",
  # graphiti-core 0.29.3 imports httpx but its wheel currently declares httpx2.
  "httpx>=0.28,<1",
  "python-dotenv>=1.2,<2",
  "tiktoken>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
graph-memory = "agent_graph_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_graph_memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
