services:
  falkordb:
    image: falkordb/falkordb@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62
    env_file:
      - path: .env.local
        required: false
    environment:
      BROWSER: "1"
      OPENAI_ADMIN_KEY: ""
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  graphiti-mcp:
    image: agent-graphiti-mcp:993e081
    build:
      context: https://github.com/getzep/graphiti.git#993e081a6d7948a0d8851c12a5fbdbeb49fed862:mcp_server
      dockerfile: docker/Dockerfile.standalone
      args:
        GRAPHITI_CORE_VERSION: 0.29.3
        VCS_REF: 993e081a6d7948a0d8851c12a5fbdbeb49fed862
    profiles: ["mcp"]
    env_file:
      - path: .env.local
        required: false
    environment:
      CONFIG_PATH: /app/mcp/config/config.yaml
      FALKORDB_URI: redis://falkordb:6379
      OPENAI_ADMIN_KEY: ""
    command:
      - sh
      - -c
      - >-
        PYTHONPATH=/workspace/src uv run --no-project python /workspace/scripts/patch_graphiti.py
        --graphiti-root /app/mcp/.venv/lib/python3.11/site-packages/graphiti_core
        --mcp-root /app/mcp &&
        uv run --no-sync main.py
    volumes:
      - ./config/graphiti-mcp.yaml:/app/mcp/config/config.yaml:ro
      - ./scripts:/workspace/scripts:ro
      - ./src:/workspace/src:ro
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      falkordb:
        condition: service_healthy

  tools:
    build: .
    profiles: ["tools"]
    env_file:
      - path: .env.local
        required: false
    environment:
      FALKORDB_HOST: falkordb
      OPENAI_ADMIN_KEY: ""
      PYTHONPATH: /workspace/src
    volumes:
      - .:/workspace
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb-data:
